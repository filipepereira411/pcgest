<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Funções do PC</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #3b82f6;
            --danger: #ef4444;
            --warning: #f59e0b;
            --success: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh; /* Corrigido de 100vi para 100vh para melhor compatibilidade */
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: var(--card-bg);
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }

        header {
            margin-bottom: 30px;
            text-align: center;
        }

        header h1 {
            font-size: 24px;
            margin-bottom: 8px;
        }

        header p {
            color: var(--text-muted);
            font-size: 14px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .btn-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 24px;
            color: var(--text-color);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            transition: all 0.3s ease;
        }

        .btn-card:hover {
            transform: translateY(-4px);
            background: rgba(255, 255, 255, 0.08);
        }

        .btn-card svg {
            width: 32px;
            height: 32px;
        }

        /* Cores temáticas para cada ação */
        .btn-desligar:hover { border-color: var(--danger); box-shadow: 0 0 15px rgba(239, 68, 68, 0.2); }
        .btn-reiniciar:hover { border-color: var(--warning); box-shadow: 0 0 15px rgba(245, 158, 11, 0.2); }
        .btn-suspender:hover { border-color: var(--primary); box-shadow: 0 0 15px rgba(59, 130, 246, 0.2); }
        .btn-bloquear:hover { border-color: var(--success); box-shadow: 0 0 15px rgba(16, 185, 129, 0.2); }

        .console {
            background: #090d16;
            border-radius: 8px;
            padding: 15px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            color: #38bdf8;
            min-height: 100px;
            max-height: 150px;
            overflow-y: auto;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .console .log-entry {
            margin-bottom: 6px;
        }
        
        .console .log-entry.executing { color: var(--warning); }
        .console .log-entry.success { color: var(--success); }
        .console .log-entry.error { color: var(--danger); }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Gestor de Funções do PC</h1>
            <p>Selecione uma ação para executar no sistema</p>
        </header>

        <div class="grid">
            <button class="btn-card btn-desligar" onclick="executarAcao('Desligar', 'shutdown /s /t 0')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18.36 6.64a9 9 0 1 1-12.73 0M12 2v10"/></svg>
                <span>Desligar</span>
            </button>

            <button class="btn-card btn-reiniciar" onclick="executarAcao('Reiniciar', 'shutdown /r /t 0')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg>
                <span>Reiniciar</span>
            </button>

            <button class="btn-card btn-suspender" onclick="executarAcao('Suspender', 'rundll32.exe powrprof.dll,SetSuspendState 0,1,0')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                <span>Suspender</span>
            </button>

            <button class="btn-card btn-bloquear" onclick="executarAcao('Bloquear', 'rundll32.exe user32.dll,LockWorkStation')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                <span>Bloquear</span>
            </button>
        </div>

        <div class="console" id="consoleLog">
            <div class="log-entry">> Sistema pronto. Aguardando comandos...</div>
        </div>
    </div>

    <script>
        function adicionarLog(mensagem, tipo = '') {
            const consoleLog = document.getElementById('consoleLog');
            const data = new Date().toLocaleTimeString();
            const novaLinha = document.createElement('div');
            
            novaLinha.className = `log-entry ${tipo}`;
            novaLinha.innerText = `[${data}] > ${mensagem}`;
            
            consoleLog.appendChild(novaLinha);
            consoleLog.scrollTop = consoleLog.scrollHeight;
        }

        function executarAcao(nomeAcao, comandoPrompt) {
            adicionarLog(`A iniciar comando para: ${nomeAcao}...`, 'executing');
            
            // Faz um pedido HTTP real para o servidor Node.js local
            fetch('/executar', {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json' 
                },
                body: JSON.stringify({ comando: comandoPrompt })
            })
            .then(res => res.json())
            .then(dados => {
                if (dados.sucesso) {
                    adicionarLog(`Comando enviado com sucesso: "${comandoPrompt}"`, 'success');
                } else {
                    adicionarLog(`Erro no sistema: ${dados.erro}`, 'error');
                }
            })
            .catch(erro => {
                adicionarLog(`Erro de ligação: O servidor Node.js está desligado.`, 'error');
            });
        }
    </script>
</body>
</html>
