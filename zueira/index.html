<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Sistema PC</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #38bdf8;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }
        h1 {
            color: var(--accent-color);
            border-bottom: 2px solid var(--card-bg);
            padding-bottom: 10px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .card {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .card h2 {
            margin-top: 0;
            font-size: 1.2rem;
            color: var(--accent-color);
        }
        .value {
            font-size: 1.5rem;
            font-weight: bold;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <h1>Painel de Gestão do PC</h1>
    
    <div class="grid">
        <!-- Cartão Sistema Operativo -->
        <div class="card">
            <h2>Sistema Operativo</h2>
            <div class="value" id="os-info">A carregar...</div>
        </div>

        <!-- Cartão Processador (CPU) -->
        <div class="card">
            <h2>Uso de CPU</h2>
            <div class="value" id="cpu-info">0%</div>
        </div>

        <!-- Cartão Memória RAM -->
        <div class="card">
            <h2>Memória RAM Livre</h2>
            <div class="value" id="ram-info">A carregar...</div>
        </div>
    </div>

    <!-- Script que vai ligar o HTML ao Electron -->
    <script src="renderer.js"></script>
</body>
</html>
